<!DOCTYPE html>
<html lang="ja">
<head>
  <link rel="stylesheet" href="style.css">
  <meta charset="UTF-8">
  <title>勉強時間記録アプリ</title>
</head>
<body>
  <div class="container">
  <h1>勉強時間記録</h1>

  <form id="form" class="form">
    <input type="text" id="subject" placeholder="科目名">
    <input type="number" id="time" placeholder="時間">
    <button id="add-btn" type="submit">追加</button>
  </form>

  <ul id="list" class="list">　</ul>
    <div id="total">合計勉強時間：0時間</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
